[project]
name = "teo-ai"
version = "0.1.0"
description = "Backend do Teo, o assistente do IntegraMente"
authors = [
    { name = "Eduardo-Franco28", email = "edu.franco2811@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.2",
    "mcp>=2.3.0",
    "numpy>=2.5.4",
    "openai>=3.31.0",
    "pgvector>=0.5.1",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic-settings>=2.16.0",
    "pyjwt>=2.15.1",
    "pypdf>=6.20.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
teo-ai = "teo_ai:main"
teo-ingest = "teo_ai.ingest:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
